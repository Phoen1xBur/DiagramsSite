server {
    server_name diagrams.chandraloca.ru www.diagrams.chandraloca.ru;

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    location /robots.txt {
        alias /var/www/school_chandraloca_ru/static/robots.txt;
    }

    # Проксирование API запросов к backend
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Проксирование WebSocket для Vite HMR
    location /ws {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Проксирование основного приложения (Vite dev server)
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/diagrams.chandraloca.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/diagrams.chandraloca.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.diagrams.chandraloca.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = diagrams.chandraloca.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name diagrams.chandraloca.ru www.diagrams.chandraloca.ru;
    listen 80;
    return 404; # managed by Certbot
}

