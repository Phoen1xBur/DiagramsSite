<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Технические работы — Диаграмма «Солнечные лучи»</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 480px;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .card h1 {
      color: #333;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .card p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .card .hint {
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Идут технические работы</h1>
    <p>Сайт временно недоступен: выполняется обновление. Зайдите через минуту.</p>
    <p class="hint">Страница обновится автоматически при появлении доступа.</p>
  </div>
  <script>
    // Опционально: раз в 10 сек проверяем, не поднялся ли сайт
    setTimeout(function() { window.location.reload(); }, 10000);
  </script>
</body>
</html>
