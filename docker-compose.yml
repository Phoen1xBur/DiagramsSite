services:
  postgres:
    image: postgres:16-alpine
    container_name: sunburst_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sunburst_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Внешний порт закомментирован - доступ только внутри Docker сети
    # Раскомментируйте следующую строку, если нужен доступ с хоста
    # ports:
    #   - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunburst_network

  redis:
    image: redis:7-alpine
    container_name: sunburst_redis
    # Внешний порт закомментирован - доступ только внутри Docker сети
    # Раскомментируйте следующую строку, если нужен доступ с хоста
    # ports:
    #   - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunburst_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunburst_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/sunburst_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:80"]}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sunburst_network
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunburst_frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sunburst_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  sunburst_network:
    driver: bridge

